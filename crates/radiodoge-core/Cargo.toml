[package]
name = "radiodoge-core"
version = "0.3.38"
description = "RadioDoge core library — protocol, wallet, and serial for all Rust targets"
authors = ["RadioDoge Contributors"]
license = "MIT"
repository = "https://github.com/jnowat/RadioDoge"
edition = "2021"
rust-version = "1.88"

[features]
# `native` (default) is the full stack: serial, wallet, chain backends, SPV.
# Without it only the protocol (`radio`, `types`) builds — small enough for
# wasm32 (see crates/radiodoge-inspector).
default = ["native"]
native = [
    "dep:tokio", "dep:tokio-util", "dep:serialport", "dep:secp256k1", "dep:sha2",
    "dep:ripemd", "dep:bs58", "dep:rand", "dep:reqwest", "dep:argon2",
    "dep:chacha20poly1305", "dep:bip39", "dep:hmac",
]

[dependencies]
# Serialization — needed for IPC types and packet encoding
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — read loop runs on Tokio
tokio      = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["full"], optional = true }

# Cross-platform serial port (Windows, Linux, macOS; Android via serialport-android later)
serialport = { version = "4", optional = true }

# Pure Rust Dogecoin cryptography — no FFI to libdogecoin
secp256k1  = { version = "0.29", features = ["rand", "global-context"], optional = true }
sha2       = { version = "0.10", optional = true }
ripemd     = { version = "0.1", optional = true }
bs58       = { version = "0.5", features = ["check"], optional = true }
rand       = { version = "0.8", optional = true }
hex        = "0.4"

# Meshtastic interop — AES-CTR channel encryption
aes        = "0.8"
ctr        = "0.9"

# HTTP client for UTXO fetching and transaction broadcast
reqwest          = { workspace = true, optional = true }

# Wallet encryption at rest — argon2id KDF + ChaCha20-Poly1305 AEAD
argon2           = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }

# BIP39 mnemonic + BIP32 HD key derivation
bip39            = { workspace = true, optional = true }
hmac             = { workspace = true, optional = true }

# Error handling
anyhow     = "1"

# Logging
log        = "0.4"
