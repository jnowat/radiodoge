<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
		<meta name="description" content="RadioDoge — Wireless P2P Dogecoin Over LoRa" />
		<!-- Favicon set via Tauri window icon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<script>
			// Apply the saved theme before first paint so every tab (not just Settings) honours it.
			try { if (localStorage.getItem('rd-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-doge-dark text-white antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
